<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Charlie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&display=swap" rel="stylesheet">
    <script src="logic.js"></script>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: "Google Sans Flex", sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }
        #page {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 16px;
            text-align: center;
        }

        h1 {
            margin: 24px 0 8px;
            font-size: 28px;
            font-weight: 400;
        }
        button {
            margin: 0;
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            color: inherit;
            cursor: pointer;
        }
        button:disabled { color: #999999; cursor: default; }
        button { display: inline-flex; flex-direction: column; align-items: center; }
        button::after {
            content: attr(data-label);
            font-weight: 700;
            height: 0;
            visibility: hidden;
            overflow: hidden;
        }
        button.pressed { font-weight: 700; }


        input {
            border: 0;
            border-bottom: 1px solid #e5e5e5;
            border-radius: 0;
            outline: none;
            background: none;
            padding: 6px 0;
            font: inherit;
            color: inherit;
            text-align: center;
        }
        input::placeholder { color: #aaaaaa; }

        .actions { color: #777777; }
        .actions button { color: #777777; }
        .actions span.sep { margin: 0 10px; }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            width: 100vw;
            margin-left: calc(50% - 50vw);   
            padding: 16px 24px 0;
        }
        #credit { color: #777777; margin-left: 0px}
        #scrape-box { margin-left: auto; text-align: right; }
        #scrape-url { width: 240px; max-width: 60vw; border-bottom: 0; text-align: right; }
        #scrape-button { margin-left: 12px; }
        #scrape-box .status { text-align: right; }

        .status { display: block; min-height: 1.5em; color: #777777; font-size: 14px; }

        #chat-container { flex: 1; overflow-y: auto; margin-top: 16px; }

        #chat-log { max-width: 560px; margin: 0 auto; text-align: left; }
        #chat-log > .from-you { text-align: right; }
        #chat-log > .from-charlie { text-align: left; }
        #chat-log > * {
            margin: 0 0 14px;
            padding: 0;
            border: 0;
            background: none;
        }

        #user-input { display: flex; padding: 16px 0 24px; }
        #user-message { flex: 1; }
        #send-button { margin-left: 16px; }
        html.dark { filter: invert(1) hue-rotate(180deg); background: #ffffff; }
        #theme-toggle { position: absolute; top: 8px; left: 8px; z-index: 10; }
    </style>
</head>
<body>
    <div id="page">
        <div id="top-bar">
            <button id="credit">Project made by Agam, Saadan, Shawon, Piyush, Serhii</button>
            <div id="scrape-box">
                <input type="text" id="scrape-url" placeholder="Add Wikipedia links" />
                <button id="scrape-button">Scrape</button>
                <span id="scrape-status" class="status"></span>
            </div>
        </div>

        <h1>Hey there! I'm Charlie</h1>

        <div class="actions">
            <button id="train-button">Start training</button>
            <span class="sep">|</span>
            <button id="clear-memory-button">Clear memory</button>
        </div>
        <span id="clear-memory-status" class="status"></span>

        <div id="chat-container">
            <div id="chat-log"></div>
        </div>

        <div id="user-input">
            <input type="text" id="user-message" placeholder="Ask me anything..." />
            <button id="send-button">Ask</button>
        </div>
    </div>

    <script>
       
        document.getElementById('credit').addEventListener('click', function() {
        document.documentElement.classList.toggle('dark');
});
        function flash(button) {
            button.classList.add('pressed');
            setTimeout(function() { button.classList.remove('pressed'); }, 200);
        }
        Array.prototype.forEach.call(document.querySelectorAll('button'), function(button) {
            button.setAttribute('data-label', button.textContent);   // used to reserve the bold width
            button.addEventListener('click', function() { flash(button); });
        });
        document.getElementById('user-message').addEventListener('keypress', function(event) {
            if (event.keyCode === 13) flash(document.getElementById('send-button'));
        });
        document.getElementById('scrape-url').addEventListener('keypress', function(event) {
            if (event.keyCode === 13) flash(document.getElementById('scrape-button'));
        });

        document.getElementById('send-button').addEventListener('click', function() {
            sendMessage();
        });

        document.getElementById('train-button').addEventListener('click', function() {
            startTraining();
        });

        document.getElementById('user-message').addEventListener('keypress', function(event) {
            if (event.keyCode === 13) { // 13 is the keycode for Enter key
                sendMessage();
            }
        });
        document.getElementById('scrape-button').addEventListener('click', function() {
            scrapeLink();
        });

        document.getElementById('scrape-url').addEventListener('keypress', function(event) {
            if (event.keyCode === 13) {
                scrapeLink();
            }
        });
        document.getElementById('clear-memory-button').addEventListener('click', function() {
            clearMemory();
        });
        var chatContainer = document.getElementById('chat-container');
        var chatLog = document.getElementById('chat-log');
        new MutationObserver(function() {
            Array.prototype.forEach.call(chatLog.children, function(line) {
                var text = line.textContent.trim();
                if (text.indexOf('You:') === 0) line.classList.add('from-you');
                else if (text.indexOf('Charlie:') === 0) line.classList.add('from-charlie');
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }).observe(chatLog, { childList: true, subtree: true, characterData: true });

        async function scrapeLink() {
            var input = document.getElementById('scrape-url');
            var button = document.getElementById('scrape-button');
            var status = document.getElementById('scrape-status');
            var url = input.value.trim();

            if (!url) {
                status.textContent = 'Please paste a Wikipedia link first.';
                return;
            }

            button.disabled = true;
            status.textContent = 'Scraping... this can take up to a minute.';
            try {
                var response = await fetch('api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                var data = {};
                try { data = await response.json(); } catch (e) { /* not JSON, e.g. a proxy error page */ }

                if (response.ok) {
                    status.textContent = data.message || 'Done.';
                    input.value = '';
                } else {
                    status.textContent = data.error || ('Scraping failed (HTTP ' + response.status + ').');
                }
            } catch (error) {
                status.textContent = 'Could not reach the server.';
            } finally {
                button.disabled = false;
            }
        }

        async function clearMemory() {
            var button = document.getElementById('clear-memory-button');
            var status = document.getElementById('clear-memory-status');
            if (!confirm('Really clear Charlie\'s memory? All scraped Wikipedia sentences will be removed.')) {
                return;
            }

            button.disabled = true;
            status.textContent = 'Clearing...';
            try {
                var response = await fetch('api/clear-memory', { method: 'POST' });
                var data = {};
                try { data = await response.json(); } catch (e) { /* not JSON, e.g. a proxy error page */ }

                if (response.ok) {
                    status.textContent = data.message || 'Memory cleared.';
                } else {
                    status.textContent = data.error || ('Clearing failed (HTTP ' + response.status + ').');
                }
            } catch (error) {
                status.textContent = 'Could not reach the server.';
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
