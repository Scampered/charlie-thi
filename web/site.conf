upstream flask-app6 {
    server flask6:8006;
}

server {
    root /var/www/html;
    listen 80;
    server_name _;

    # http://localhost:5002/ opens the chat page directly
    index charlie.html;

    location /api/ {
        proxy_pass http://flask-app6/;
        proxy_set_header Host "localhost";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_read_timeout 120s;   # scraping can take a while
    }
}
