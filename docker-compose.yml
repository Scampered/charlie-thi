services:
  nginx6:
    container_name: nginx6
    build:
      context: ./web
      dockerfile: ./Dockerfile
    ports:
      - "5002:80"            # open the chat at http://localhost:5002
    volumes:
      - ./web/site.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - my-network6
    depends_on:
      - flask6
    restart: unless-stopped

  flask6:
    build:
      context: ./
      dockerfile: ./Dockerfile
    container_name: flask6
    environment:
      - PYTHONUNBUFFERED=1   # print() shows up in "docker compose logs" right away
    command: gunicorn --bind 0.0.0.0:8006 --workers 2 --timeout 120 "app.create_app:create_app()"
    volumes:
      - ./:/app              # this folder is /app inside the container
    networks:
      my-network6:
        aliases:
          - flask-app6
    restart: unless-stopped

networks:
  my-network6:
